[project]
name = "agentorchestra"
version = "0.1.0"
description = "agentorchestra using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]>=1.15.10,<2.0.0",
    "groq>=0.31.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "streamlit>=1.47.0,<2.0.0",
    "playwright>=1.54.0,<2.0.0",
]

[project.scripts]
kickoff = "agentorchestra.main:kickoff"
run_crew = "agentorchestra.main:kickoff"
plot = "agentorchestra.main:plot"
run_with_trigger = "agentorchestra.main:run_with_trigger"
agentorchestra-manager = "agentorchestra.scripts.run_manager:main"
agentorchestra-routing-benchmark = "agentorchestra.scripts.run_routing_benchmark:main"
agentorchestra-specialist = "agentorchestra.scripts.run_specialist:main"
agentorchestra-edit-preview = "agentorchestra.scripts.run_edit_preview:main"
agentorchestra-edit = "agentorchestra.scripts.run_edit_flow:main"
agentorchestra-reset = "agentorchestra.scripts.reset_demo_site:main"
agentorchestra-lighthouse-seo = "agentorchestra.scripts.run_lighthouse_seo:main"
agentorchestra-ui = "agentorchestra.scripts.run_ui:main"
agentorchestra-screenshot = "agentorchestra.scripts.capture_page_screenshot:main"
agentorchestra-demo = "agentorchestra.scripts.run_demo:main"
agentorchestra-verify-install = "agentorchestra.scripts.verify_clean_install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=6.2.0,<7.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/feasibility/check_*.py" = ["E402"]
