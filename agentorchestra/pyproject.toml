[project]
name = "agentorchestra"
version = "0.1.0"
description = "agentorchestra using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.10,<2.0.0"
]

[project.scripts]
kickoff = "agentorchestra.main:kickoff"
run_crew = "agentorchestra.main:kickoff"
plot = "agentorchestra.main:plot"
run_with_trigger = "agentorchestra.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
