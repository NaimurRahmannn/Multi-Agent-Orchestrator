<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Harbor Light Studio</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Harbor Light Studio</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <main class="content-page">
      <section class="page-intro">
        <h1>Contact us</h1>
        <p>Tell us what you need, and we will reply with a simple next step.</p>
      </section>
      <section class="contact-layout">
        <form class="contact-form" action="#" method="post">
          <label for="name">Name</label>
          <input id="name" name="name" type="text">
          <label for="email">Email</label>
          <input id="email" name="email" type="email">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5"></textarea>
          <button class="button-link" type="submit">Send message</button>
        </form>
        <aside class="contact-note">
          <img class="note-image" src="assets/studio-mark.svg" alt="Small lighthouse mark">
          <h2>Office hours</h2>
          <p>Monday through Friday, 9:00 to 5:00. Static forms on this demo site do not submit anywhere.</p>
        </aside>
      </section>
    </main>
    <footer class="site-footer">
      <p>Email hello@example.test for demo inquiries.</p>
    </footer>
  </body>
</html>
